name: Build CIA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git build-essential cmake pkg-config python3
          dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Build makerom
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          cd /tmp/ctr/makerom
          make deps
          make -j"$(nproc)"
          cp bin/makerom /usr/local/bin/

      - name: Build bannertool
        run: |
          git clone --depth 1 --recursive https://github.com/carstene1ns/3ds-bannertool.git /tmp/bt
          cd /tmp/bt
          cmake -B build .
          cmake --build build -j"$(nproc)"
          cp build/bannertool /usr/local/bin/

      - name: Generate icon, banner and audio
        run: python3 tools/make_assets.py

      - name: Build game
        run: make all cia

      - name: Build DSP1 (sound-file dumper)
        continue-on-error: true
        run: |
          make -C dsp1 all cia
          cp dsp1/dsp1.cia dsp1/dsp1.3dsx .

      - name: Show built files
        run: ls -l shift3ds.cia shift3ds.3dsx dsp1.cia dsp1.3dsx || true

      - uses: actions/upload-artifact@v4
        with:
          name: shift3ds
          if-no-files-found: error
          path: |
            shift3ds.cia
            shift3ds.3dsx
            dsp1.cia
            dsp1.3dsx

      - name: Publish as a normal download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Shift 3DS (newest build)
          body: |
            Newest build. Tap shift3ds.cia below, then install it with FBI.
            shift3ds.3dsx is the same game for the Homebrew Launcher.

            Want the music? Install dsp1.cia the same way and run it once.
            It saves the sound file (dspfirm.cdc) the game needs. DSP1 is
            by zoogie (MIT licence).
          files: |
            shift3ds.cia
            shift3ds.3dsx
            dsp1.cia
            dsp1.3dsx
